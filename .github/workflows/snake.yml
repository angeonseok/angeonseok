name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 아래 push 단계가 output 브랜치를 dist 내용으로 덮어쓰므로 언어 카드도 이 job에서 함께 만든다.
      # lowlighter/metrics는 fine-grained 토큰을 거부해서, 읽기 전용 토큰으로 REST API를 쓰는 스크립트를 사용한다.
      - name: Generate languages card
        run: python3 .github/scripts/languages_card.py dist/languages.svg
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: angeonseok
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
